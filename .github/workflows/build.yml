name: Package and publish
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/fe13242281a67641c0102cdb1087f0ebe586c7df.tar.gz
      - name: Validate release metadata and tooling
        run: |
          nix-shell -p cargo rustc rustfmt clippy --run 'cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings && cargo run --locked -- metadata'
      - name: Run regression checks
        run: |
          dotnet run --project tests/Tests.csproj
          dotnet format tests/Tests.csproj --verify-no-changes --no-restore
  package:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.metadata.outputs.filename }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/fe13242281a67641c0102cdb1087f0ebe586c7df.tar.gz
      - name: Package Thunderstore ZIP
        id: metadata
        run: |
          nix-shell -p cargo rustc --run 'cargo run --locked -- metadata'
          dotnet tool restore
          dotnet tool run tcli build --config-path dist/thunderstore.toml
          nix-shell -p cargo rustc --run 'cargo run --locked -- package'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: thunderstore-package
          path: dist/${{ steps.metadata.outputs.filename }}
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: thunderstore
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/fe13242281a67641c0102cdb1087f0ebe586c7df.tar.gz
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: thunderstore-package
          path: dist
      - name: Verify package and restore Thunderstore CLI
        run: |
          nix-shell -p cargo rustc --run 'cargo run --locked -- package'
          dotnet tool restore
      - name: Publish the built ZIP
        env:
          TCLI_AUTH_TOKEN: ${{ secrets.TCLI_AUTH_TOKEN }}
          PACKAGE_FILE: ${{ needs.package.outputs.filename }}
        run: |
          test -n "$TCLI_AUTH_TOKEN" || { echo 'Set the TCLI_AUTH_TOKEN secret.'; exit 1; }
          dotnet tool run tcli publish --config-path dist/thunderstore.toml --file "dist/$PACKAGE_FILE"
